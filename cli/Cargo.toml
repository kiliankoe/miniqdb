[package]
name = "mqdb"
version = "0.1.2"
edition = "2024"
description = "CLI and TUI companion for miniqdb quote databases"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
etcetera = "0.11"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
