name: CLI CI

on:
  push:
    branches: [main]
    paths: ["cli/**", ".github/workflows/ci-rust.yml"]
  pull_request:
    paths: ["cli/**", ".github/workflows/ci-rust.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      # Integration tests boot a real PocketBase; cache the pinned binary.
      - uses: actions/cache@v6
        with:
          path: .pb-test
          key: pb-test-${{ hashFiles('cli/tests/harness/mod.rs') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
