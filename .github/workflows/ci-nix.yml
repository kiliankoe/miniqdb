name: Nix CI

on:
  push:
    branches: [main]
    paths-ignore: ["cli/**", ".github/workflows/ci-rust.yml"]
  pull_request:
    paths-ignore: ["cli/**", ".github/workflows/ci-rust.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      # The packages the NixOS module deploys.
      - run: nix build -L .#frontend .#pocketbase
      # Boots the module in a VM; hosted Linux runners have KVM.
      - run: nix build -L .#checks.x86_64-linux.nixos-module
