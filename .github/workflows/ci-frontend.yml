name: Frontend CI

on:
  push:
    branches: [main]
    paths-ignore: ["cli/**", ".github/workflows/ci-rust.yml"]
  pull_request:
    paths-ignore: ["cli/**", ".github/workflows/ci-rust.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Integration tests boot a real PocketBase; cache the binary per pinned version.
      - uses: actions/cache@v6
        with:
          path: .pb-test
          key: pb-test-${{ hashFiles('pocketbase/Dockerfile') }}
      # The postinstall script regenerates bun.nix, so any diff means it no
      # longer matches bun.lock. `add -N` makes a missing bun.nix show up too.
      - run: bun install --frozen-lockfile
      - run: git add -N bun.nix && git diff --exit-code bun.nix
      - run: bun run lint
      - run: bun run build
      - run: bun run test:all
